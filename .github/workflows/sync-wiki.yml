name: Sync to coi wiki

# Mirrors the Markdown pages in this repo into the GitHub wiki of coipond/coi
# (the "hidden" coipond/coi.wiki git repo that backs the Wiki tab). This repo is
# the source of truth — edit pages here (via PRs), and every push to master
# publishes them to the wiki. The Wiki tab should be treated as a read-only
# mirror; direct edits there will be overwritten on the next sync.
#
# Pages are organised into section directories here (getting-started/, usage/,
# security/, ...) for the future docs website. GitHub wikis are flat, so the sync
# FLATTENS every page to its basename at the wiki root — e.g.
# security/Security-Monitoring.md -> Security-Monitoring. Basenames must therefore
# be globally unique; a collision fails the sync loudly. Flattening by basename
# (not by path) keeps every existing wiki page name and link intact.
#
# Requires a repository secret WIKI_SYNC_TOKEN: a token with write (Contents)
# access to coipond/coi (the wiki shares that repo's access). A fine-grained PAT
# scoped to coipond/coi with Contents: Read and write works; so does a classic
# PAT with `repo` scope. The built-in GITHUB_TOKEN cannot be used because it only
# reaches this repo, not coipond/coi's wiki.

on:
  push:
    branches: [master]
    paths: ['**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (this repo)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: source

      - name: Publish Markdown to coipond/coi wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${WIKI_TOKEN:-}" ]; then
            echo "::error::WIKI_SYNC_TOKEN secret is not set. Add a token with write access to coipond/coi."
            exit 1
          fi

          git config --global user.name "coi-wiki-sync[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone --depth 1 \
            "https://x-access-token:${WIKI_TOKEN}@github.com/coipond/coi.wiki.git" wiki

          # Source is authoritative: drop the wiki's current top-level pages, then
          # copy this repo's pages over (flattened to basename, excluding repo meta
          # docs). This makes renames and deletions propagate, not just edits.
          find wiki -maxdepth 1 -type f -name '*.md' -delete

          declare -A seen
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            case "$base" in
              README.md) continue ;;   # repo meta doc, not a wiki page
            esac
            if [ -n "${seen[$base]:-}" ]; then
              echo "::error::Duplicate wiki page '$base' after flattening: '$f' and '${seen[$base]}'. Page basenames must be unique across all directories."
              exit 1
            fi
            seen[$base]="$f"
            cp "$f" "wiki/$base"
          done < <(find source -type f -name '*.md' -not -path 'source/.github/*' -print0)

          cd wiki
          if [ -z "$(git status --porcelain)" ]; then
            echo "Wiki already up to date; nothing to sync."
            exit 0
          fi
          git add -A
          git commit -m "sync: from coipond/coi-wiki@${GITHUB_SHA::7}"
          git push origin HEAD
